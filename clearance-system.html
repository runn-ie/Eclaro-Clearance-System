<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Student Clearance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#132a45;
  --green-700:#1d3f66;
  --green-600:#27517f;
  --green-100:#e8edf4;
  --orange-600:#7d9b3e;
  --orange-500:#93b34c;
  --orange-100:#eef3e1;
  --ink:#232a2f;
  --ink-soft:#5b636b;
  --paper:#f6f7f6;
  --paper-2:#eef0f1;
  --white:#ffffff;
  --line:#e1e5e8;
  --blue:#2f6fed;
  --blue-100:#e8eefd;
  --red:#d64545;
  --red-100:#fbe7e7;
  --gray:#868e94;
  --gray-100:#eef0f1;
  --shadow:0 2px 10px rgba(20,30,20,.06), 0 1px 2px rgba(20,30,20,.05);
  --shadow-lg:0 12px 32px rgba(15,40,25,.12);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;margin:0;letter-spacing:-0.01em;}
p{margin:0;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.mono{font-family:'JetBrains Mono',monospace;}
img{max-width:100%;display:block;}
.hidden{display:none !important;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;font-weight:600;font-size:14.5px;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green-700);color:#fff;box-shadow:0 4px 14px rgba(27,110,76,.28);}
.btn-primary:hover{background:var(--green-900);}
.btn-orange{background:var(--orange-600);color:#fff;box-shadow:0 4px 14px rgba(234,122,23,.28);}
.btn-orange:hover{background:#d5690e;}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--green-700);color:var(--green-700);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink);}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{background:#b93636;}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}

/* ---------- Badges / status ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:100px;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-approved{background:var(--green-100);color:var(--green-700);}
.badge-pending{background:var(--orange-100);color:var(--orange-600);}
.badge-progress{background:var(--blue-100);color:var(--blue);}
.badge-rejected{background:var(--red-100);color:var(--red);}
.badge-notstarted{background:var(--gray-100);color:var(--gray);}

/* ---------- Landing header ---------- */
.landing-header{
  position:sticky;top:0;z-index:50;background:rgba(246,247,244,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.header-inner{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:11px;}
.brand-mark{
  width:42px;height:42px;border-radius:11px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  padding:5px;overflow:hidden;flex-shrink:0;
}
.brand-mark img{width:100%;height:100%;object-fit:contain;}
.brand-name{font-family:'Poppins';font-weight:700;font-size:16.5px;line-height:1.15;}
.brand-name span{display:block;font-family:'Inter';font-weight:500;font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;}
.nav-links{display:flex;align-items:center;gap:30px;}
.nav-links a{font-size:14.5px;font-weight:500;color:var(--ink-soft);transition:color .15s;}
.nav-links a:hover{color:var(--green-700);}
.header-actions{display:flex;align-items:center;gap:20px;}
.hamburger{display:none;}

/* ---------- Hero ---------- */
.hero{max-width:1180px;margin:0 auto;padding:64px 28px 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--green-100);color:var(--green-700);
  font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:100px;margin-bottom:20px;}
.hero-eyebrow::before{content:'●';color:var(--orange-600);font-size:10px;}
.hero h1{font-size:44px;line-height:1.08;font-weight:800;color:var(--green-900);}
.hero h1 em{font-style:normal;color:var(--orange-600);}
.hero p.lead{margin-top:18px;font-size:17px;line-height:1.6;color:var(--ink-soft);max-width:480px;}
.hero-actions{display:flex;gap:14px;margin-top:30px;}
.hero-stats{display:flex;gap:28px;margin-top:38px;padding-top:26px;border-top:1px solid var(--line);}
.hero-stats .stat b{display:block;font-family:'Poppins';font-size:22px;color:var(--green-900);}
.hero-stats .stat span{font-size:12.5px;color:var(--ink-soft);}
.hero-visual{position:relative;}
.campus-card{
  border-radius:22px;overflow:hidden;background:linear-gradient(155deg, var(--green-700), var(--green-900));
  aspect-ratio:4/3.1;position:relative;box-shadow:var(--shadow-lg);
}
.campus-card .texture{position:absolute;inset:0;opacity:.18;
  background-image:radial-gradient(circle at 20% 30%, #fff 0, transparent 45%), radial-gradient(circle at 80% 75%, var(--orange-500) 0, transparent 40%);}
.campus-card .seal{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;
}
.seal-emblem{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;
  padding:10px;margin-bottom:16px;overflow:hidden;}
.seal-emblem img{width:100%;height:100%;object-fit:contain;}
.campus-card .label{font-family:'Poppins';font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;}
.campus-card .sub{font-size:12.5px;opacity:.75;margin-top:4px;}
.float-chip{
  position:absolute;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);padding:14px 16px;display:flex;align-items:center;gap:11px;
}
.float-chip.a{bottom:-22px;left:-20px;}
.float-chip.b{top:-18px;right:-16px;}
.chip-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.chip-ic.green{background:var(--green-100);}
.chip-ic.orange{background:var(--orange-100);}
.chip-text b{display:block;font-size:13px;}
.chip-text span{font-size:11.5px;color:var(--ink-soft);}

/* ---------- Section shell ---------- */
.section{max-width:1180px;margin:0 auto;padding:70px 28px;}
.section-head{max-width:600px;margin-bottom:40px;}
.eyebrow-sm{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-600);margin-bottom:10px;display:block;}
.section-head h2{font-size:30px;font-weight:700;color:var(--green-900);}
.section-head p{margin-top:10px;color:var(--ink-soft);font-size:15.5px;line-height:1.6;}
.section.alt{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}

/* Mission / Vision */
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.mv-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:30px;position:relative;overflow:hidden;}
.mv-card.vision{background:var(--green-900);color:#fff;border:none;}
.mv-card .tag{font-family:'Poppins';font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--orange-600);}
.mv-card.vision .tag{color:var(--orange-500);}
.mv-card p{margin-top:14px;line-height:1.7;font-size:15px;}
.mv-card.vision p{color:rgba(255,255,255,.85);}

/* How it works */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;}
.step{position:relative;padding:0 14px;}
.step-num{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--white);background:var(--green-700);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.step:nth-child(even) .step-num{background:var(--orange-600);}
.step h4{font-size:14.5px;margin-bottom:6px;}
.step p{font-size:13px;color:var(--ink-soft);line-height:1.5;}
.step-line{position:absolute;top:15px;left:calc(-50% + 15px);width:100%;height:2px;background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);z-index:0;}
.step:first-child .step-line{display:none;}

/* Feature grid */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.feat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:transform .15s, box-shadow .15s;}
.feat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);}
.feat-ic{width:38px;height:38px;border-radius:10px;background:var(--green-100);color:var(--green-700);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px;}
.feat-card h4{font-size:15px;margin-bottom:6px;}
.feat-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;}

/* Announcements */
.ann-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
.ann-item{background:#fff;padding:18px 22px;display:flex;gap:16px;align-items:flex-start;}
.ann-date{font-family:'JetBrains Mono';font-size:11.5px;color:var(--white);background:var(--green-700);padding:5px 9px;border-radius:7px;white-space:nowrap;font-weight:600;}
.ann-item h4{font-size:14.5px;margin-bottom:4px;}
.ann-item p{font-size:13.5px;color:var(--ink-soft);}

/* Contact + footer */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.contact-list{display:flex;flex-direction:column;gap:18px;}
.contact-row{display:flex;gap:14px;align-items:flex-start;}
.contact-row .ic{width:36px;height:36px;border-radius:9px;background:var(--orange-100);color:var(--orange-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.contact-row b{display:block;font-size:14px;}
.contact-row span{font-size:13.5px;color:var(--ink-soft);}
.footer{background:var(--green-900);color:rgba(255,255,255,.7);}
.footer-inner{max-width:1180px;margin:0 auto;padding:44px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.footer-inner .brand-name{color:#fff;}
.footer-inner .brand-name span{color:rgba(255,255,255,.55);}
.footer small{font-size:12.5px;}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
  background:radial-gradient(circle at 15% 15%, var(--green-100), transparent 40%), radial-gradient(circle at 85% 85%, var(--orange-100), transparent 40%), var(--paper);}
.auth-card{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;padding:38px 34px;border:1px solid var(--line);}
.auth-logo{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px;}
.auth-logo .brand-mark{margin-bottom:12px;width:64px;height:64px;border-radius:16px;}
.auth-logo h3{font-size:16px;}
.auth-logo span{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.role-tabs{display:flex;background:var(--paper-2);border-radius:10px;padding:4px;margin-bottom:22px;}
.role-tab{flex:1;text-align:center;padding:9px 6px;font-size:13px;font-weight:600;border-radius:7px;color:var(--ink-soft);transition:.15s;}
.role-tab.active{background:#fff;color:var(--green-700);box-shadow:var(--shadow);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:7px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;font-family:inherit;color:var(--ink);
  transition:border-color .15s; background:#fcfdfb;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-700);background:#fff;}
.field-error{border-color:var(--red) !important;}
.field-error-msg{font-size:12px;color:var(--red);margin-top:5px;display:none;}
.field-hint{font-size:12px;color:var(--ink-soft);margin-top:5px;}
.auth-row-between{display:flex;justify-content:space-between;align-items:center;margin:14px 0 20px;font-size:13px;}
.link-btn{color:var(--green-700);font-weight:600;font-size:13px;}
.link-btn:hover{text-decoration:underline;}
.auth-switch{text-align:center;margin-top:20px;font-size:13.5px;color:var(--ink-soft);}
.demo-note{margin-top:18px;background:var(--orange-100);color:#8a4f0f;font-size:12px;padding:10px 12px;border-radius:9px;line-height:1.5;}

/* ---------- App shell (student/admin) ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:240px;flex-shrink:0;background:var(--green-900);color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-brand .brand-name{color:#fff;font-size:14.5px;}
.sidebar-brand .brand-name span{color:rgba(255,255,255,.5);}
.side-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.side-link{display:flex;align-items:center;gap:12px;padding:10.5px 14px;border-radius:9px;font-size:13.8px;font-weight:500;color:rgba(255,255,255,.65);transition:.15s;}
.side-link .ic{font-size:16px;width:20px;text-align:center;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:rgba(255,255,255,.13);color:#fff;}
.side-link.active .ic{color:var(--orange-500);}
.side-foot{padding:16px 12px;border-top:1px solid rgba(255,255,255,.1);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:66px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:'Poppins';font-weight:700;font-size:17px;}
.topbar-right{display:flex;align-items:center;gap:18px;}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--paper-2);font-size:16px;}
.icon-btn:hover{background:var(--gray-100);}
.icon-dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--orange-600);border:2px solid #fff;}
.profile-chip{display:flex;align-items:center;gap:9px;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(140deg,var(--green-700),var(--green-900));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.profile-chip .who{font-size:13px;line-height:1.25;}
.profile-chip .who b{display:block;}
.profile-chip .who span{color:var(--ink-soft);font-size:11.5px;}
.content{padding:28px;max-width:1180px;width:100%;}

/* notif dropdown */
.dropdown{position:relative;}
.dropdown-panel{
  position:absolute;top:48px;right:0;width:340px;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--line);
  z-index:60;overflow:hidden;
}
.dropdown-panel .dh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;}
.dropdown-panel .dh button{font-size:11.5px;color:var(--green-700);font-weight:600;}
.dl-list{max-height:340px;overflow-y:auto;}
.dl-item{padding:13px 16px;border-bottom:1px solid var(--paper-2);display:flex;gap:10px;}
.dl-item:last-child{border-bottom:none;}
.dl-item .dot{width:8px;height:8px;border-radius:50%;background:var(--orange-600);margin-top:5px;flex-shrink:0;}
.dl-item.read .dot{background:var(--gray);}
.dl-item p{font-size:13px;line-height:1.4;}
.dl-item span{font-size:11px;color:var(--ink-soft);}

/* Cards / stats */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{padding:20px;display:flex;flex-direction:column;gap:8px;}
.stat-card .ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:4px;}
.stat-card b{font-family:'Poppins';font-size:26px;color:var(--green-900);}
.stat-card span{font-size:12.5px;color:var(--ink-soft);font-weight:500;}

/* welcome / progress seal */
.welcome-row{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:24px;}
.welcome-card{padding:26px 28px;background:linear-gradient(120deg,var(--green-900),var(--green-700));color:#fff;position:relative;overflow:hidden;}
.welcome-card::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);}
.welcome-card h2{font-size:22px;margin-bottom:4px;}
.welcome-card p{color:rgba(255,255,255,.75);font-size:13.5px;}
.info-pills{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.info-pill{background:rgba(255,255,255,.1);padding:8px 13px;border-radius:9px;font-size:12px;}
.info-pill b{display:block;font-size:13.5px;margin-top:1px;}
.seal-card{padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.progress-ring-wrap{position:relative;width:132px;height:132px;margin-bottom:12px;}
.progress-ring-wrap svg{transform:rotate(-90deg);}
.ring-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-pct b{font-family:'Poppins';font-size:26px;color:var(--green-900);}
.ring-pct span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}

/* Section title row w/ actions */
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.row-between h3{font-size:16.5px;}
.card-pad{padding:22px;}

/* table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.8px;}
thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;padding:12px 16px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
tbody td{padding:14px 16px;border-bottom:1px solid var(--paper-2);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--paper);}
.cell-main{font-weight:600;}
.cell-sub{color:var(--ink-soft);font-size:12px;}

/* filters bar */
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.filters-bar input,.filters-bar select{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:#fff;}
.filters-bar input{min-width:220px;}
.search-wrap{position:relative;}
.search-wrap span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray);font-size:13px;}
.search-wrap input{padding-left:32px;}

/* timeline */
.timeline{position:relative;padding-left:6px;}
.tl-item{display:flex;gap:16px;padding-bottom:26px;position:relative;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot-col{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;z-index:1;font-weight:700;}
.tl-dot.done{background:var(--green-700);color:#fff;}
.tl-dot.current{background:var(--orange-600);color:#fff;box-shadow:0 0 0 5px var(--orange-100);}
.tl-dot.todo{background:var(--gray-100);color:var(--gray);}
.tl-bar{width:2px;flex:1;background:var(--line);margin-top:2px;}
.tl-dot-col.done-bar .tl-bar{background:var(--green-700);}
.tl-content{padding-bottom:4px;flex:1;}
.tl-content h4{font-size:14.5px;}
.tl-content .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.tl-content .remark{margin-top:8px;background:var(--paper);padding:9px 12px;border-radius:8px;font-size:12.5px;color:var(--ink-soft);}

/* upload */
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;background:var(--paper);transition:.15s;}
.dropzone.drag{border-color:var(--green-700);background:var(--green-100);}
.dropzone .dz-ic{font-size:30px;margin-bottom:10px;}
.dropzone h4{font-size:14.5px;margin-bottom:4px;}
.dropzone p{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
.doc-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;margin-top:10px;}
.doc-ic{width:38px;height:38px;border-radius:9px;background:var(--green-100);color:var(--green-700);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}
.doc-info b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-info span{font-size:11.5px;color:var(--ink-soft);}
.doc-bar{height:5px;background:var(--paper-2);border-radius:4px;margin-top:6px;overflow:hidden;}
.doc-bar i{display:block;height:100%;background:var(--green-700);border-radius:4px;transition:width .4s;}
.doc-actions{display:flex;gap:6px;flex-shrink:0;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.close-x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--paper-2);font-size:15px;}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.kv div{background:var(--paper);padding:10px 12px;border-radius:9px;}
.kv div span{display:block;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.kv div b{font-size:13.5px;}

/* toast */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--green-900);color:#fff;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;animation:toastin .25s ease;max-width:320px;}
.toast.err{background:var(--red);}
@keyframes toastin{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}

/* empty state */
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty .ic{font-size:34px;margin-bottom:10px;}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:5px;}
.empty p{font-size:13px;}

/* bars for reports */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.bar-row .lbl{width:110px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
.bar-track{flex:1;height:12px;background:var(--paper-2);border-radius:7px;overflow:hidden;}
.bar-fill{height:100%;border-radius:7px;}
.bar-row .val{width:34px;text-align:right;font-size:12.5px;font-weight:700;flex-shrink:0;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}

/* responsive */
@media(max-width:980px){
  .hero{grid-template-columns:1fr;padding-top:36px;}
  .hero-visual{order:-1;}
  .mv-grid,.contact-grid,.grid2,.grid3,.feat-grid{grid-template-columns:1fr;}
  .steps{grid-template-columns:1fr;gap:22px;}
  .step-line{display:none;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .welcome-row{grid-template-columns:1fr;}
  .nav-links{display:none;}
  .sidebar{position:fixed;left:-240px;z-index:80;transition:left .2s;box-shadow:var(--shadow-lg);}
  .sidebar.open{left:0;}
  .hamburger{display:flex;}
}
@media(max-width:640px){
  .stat-grid{grid-template-columns:1fr;}
  .header-inner{padding:12px 16px;}
  .content{padding:18px;}
  .topbar{padding:0 16px;}
}
</style>

  const letters = (name||'').replace(/[^a-zA-Z ]/g,'').trim();

}

function toast(msg, err){
  const id = 't'+(state.toastId++);
  const el = document.createElement('div');
  el.className='toast'+(err?' err':'');
  el.id=id;
  el.innerHTML = (err?'⚠️ ':'✅ ')+msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

function statusBadge(status){
  const map = {
    approved:['badge-approved','Approved'], pending:['badge-pending','Pending'],
    progress:['badge-progress','In Progress'], rejected:['badge-rejected','Rejected'],
    notstarted:['badge-notstarted','Not Started'], completed:['badge-approved','Completed'],
    "under review":['badge-progress','Under Review'],
  };
  const m = map[status] || ['badge-notstarted', status];
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}

function computeProgress(){
  const total = state.requirements.length;
  const done = state.requirements.filter(r=>r.status==='approved').length;
  return Math.round((done/total)*100);
}

  if(state.role==='admin') app.innerHTML = renderAppShell('admin');
  if(state.role==='staff') app.innerHTML = renderAppShell('staff');
  attachAppEvents();
}

  <section class="section" id="clearance">
    <div class="section-head">
      <span class="eyebrow-sm">The process</span>
      <h2>How Clearance Works</h2>
    </div>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><h4>Log In</h4><p>Sign in with your student ID and password.</p></div>
      <div class="step"><div class="step-line"></div><div class="step-num">2</div><h4>Submit Clearance</h4><p>Start a request for the current school year.</p></div>
      <div class="step"><div class="step-line"></div><div class="step-num">3</div><h4>Complete Requirements</h4><p>Upload documents for each office.</p></div>
      <div class="step"><div class="step-line"></div><div class="step-num">4</div><h4>Offices Verify</h4><p>Each office reviews and approves its item.</p></div>
      <div class="step"><div class="step-line"></div><div class="step-num">5</div><h4>Clearance Completed</h4><p>Download your finished certificate.</p></div>
    </div>
  </section>

  <section class="section alt">
    <div class="section-head">
      <span class="eyebrow-sm">What's included</span>
      <h2>Clearance Features</h2>
    </div>
    <div class="feat-grid">
      <div class="feat-card"><div class="feat-ic">📊</div><h4>Live Progress Tracking</h4><p>Watch your clearance percentage update in real time as each office signs off.</p></div>
      <div class="feat-card"><div class="feat-ic">📎</div><h4>Document Upload</h4><p>Attach required files directly — no more physical folders or lost forms.</p></div>
      <div class="feat-card"><div class="feat-ic">🔔</div><h4>Instant Notifications</h4><p>Get notified the moment an office approves, rejects, or requests a correction.</p></div>
      <div class="feat-card"><div class="feat-ic">🕐</div><h4>Full Timeline</h4><p>See exactly which office your request is with and what happens next.</p></div>
      <div class="feat-card"><div class="feat-ic">🗂️</div><h4>Clearance History</h4><p>Access every past clearance request from previous school years.</p></div>
      <div class="feat-card"><div class="feat-ic">🔒</div><h4>Role-Based Access</h4><p>Students, office staff, and admins each see exactly what they need.</p></div>
    </div>
  </section>

function attachAppEvents(){} // placeholder overwritten below

document.addEventListener('click', function(e){
  const roleTab = e.target.closest('.role-tab');
  if(roleTab){ loginRole = roleTab.dataset.role; render(); return; }
  const back = e.target.closest('#backHome');
  if(back){ e.preventDefault(); state.role=null; state.page='landing'; render(); return; }
  const forgot = e.target.closest('#forgotBtn');
  if(forgot){ e.preventDefault(); toast('Password reset instructions sent (demo).'); return; }
});
document.addEventListener('submit', function(e){
  if(e.target.id==='loginForm'){
    e.preventDefault();
    const u=document.getElementById('loginUser').value.trim();
    const p=document.getElementById('loginPass').value.trim();
    if(!u||!p){ document.getElementById('loginErr').style.display='block'; document.getElementById('loginPass').classList.add('field-error'); return; }
    state.role = loginRole;
    state.page = 'dashboard';
    render();
    toast('Welcome back!');
  }
});

/* ============ PAGE ROUTER ============ */
function renderPage(role){
  if(role==='student'){
    switch(state.page){
      case 'dashboard': return pageStudentDashboard();
      case 'requirements': return pageRequirements();
      case 'request': return pageNewRequest();
      case 'documents': return pageDocuments();
      case 'tracking': return pageTracking();
      case 'notifications': return pageNotifications();
      case 'history': return pageHistory();
      case 'profile': return pageProfile();
      case 'settings': return pageSettings();
      default: return pageStudentDashboard();
    }
  }
  if(role==='admin'){
    switch(state.page){
      case 'dashboard': return pageAdminDashboard();
      case 'students': return pageAdminStudents();
      case 'requests': return pageAdminRequests();
      case 'offices': return pageAdminOffices();
      case 'requirements_cfg': return pageAdminRequirementsCfg();
      case 'staff': return pageAdminStaff();
      case 'reports': return pageAdminReports();
      case 'notifications': return pageNotifications();
      case 'settings': return pageSettings();
      default: return pageAdminDashboard();
    }
  }
  if(role==='staff'){
    switch(state.page){
      case 'dashboard': return pageStaffDashboard();
      case 'queue': return pageStaffQueue();
      case 'settings': return pageSettings();
      default: return pageStaffDashboard();
    }
  }
  return '';
}

/* ============ STUDENT: DASHBOARD ============ */
function progressRingSVG(pct){
  const r=54, c=2*Math.PI*r, off = c - (pct/100)*c;
  return `<svg width="132" height="132" viewBox="0 0 132 132">
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="#eef0f1" stroke-width="12"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="#1d3f66" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s ease;"/>
  </svg>`;
}
function overallStatus(){
  const pct = computeProgress();
  if(pct===100) return {label:'COMPLETED', cls:'badge-approved', dot:'🟢'};
  if(state.requirements.some(r=>r.status==='rejected')) return {label:'ACTION NEEDED', cls:'badge-rejected', dot:'🔴'};
  return {label:'IN PROGRESS', cls:'badge-progress', dot:'🟢'};
}

/* ============ STUDENT: TRACKING ============ */
function pageTracking(){
  const stages = ["Request Submitted","Registrar","Library","Accounting","Laboratory","Guidance","Final Verification","Completed"];
  const reqMap = {};
  state.requirements.forEach(r=>reqMap[r.office]=r);
  let currentIdx = 1;
  stages.forEach((s,i)=>{ if(reqMap[s] && reqMap[s].status==='approved') currentIdx = i+1; });
  return `
  <div class="card card-pad">
    <div class="row-between"><h3>Current Request — Semestral Clearance</h3><span class="badge badge-progress mono">REQ-20260810</span></div>
    <div class="timeline" style="margin-top:20px;">
      ${stages.map((s,i)=>{
        const r = reqMap[s];
        let dotClass='todo', icon=(i+1);
        if(i < currentIdx) dotClass='done', icon='✓';
        else if(i===currentIdx) dotClass='current';
        const status = r ? r.status : (i===0?'approved':i===stages.length-1?'notstarted':'notstarted');
        return `<div class="tl-item">
          <div class="tl-dot-col ${i<currentIdx?'done-bar':''}">
            <div class="tl-dot ${dotClass}">${icon}</div>
            ${i<stages.length-1?'<div class="tl-bar"></div>':''}
          </div>
          <div class="tl-content">
            <h4>${s}</h4>
            <div class="meta">${r? (r.by? 'Processed by '+r.by+(r.date?' · '+r.date:'') : 'Awaiting action') : (i===0?'Submitted by student · Aug 10, 2026':'Not yet reached')}</div>
            ${statusBadge(r? r.status : (i===0?'approved':'notstarted'))}
            ${r && r.remarks ? `<div class="remark">"${r.remarks}"</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

      <td>${statusBadge(s.status)}</td>
      <td><button class="btn btn-primary btn-sm staff-review" data-i="${i}">Review</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}

/* ============ MODALS ============ */
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function modalRequirementDetail(office){
  const r = state.requirements.find(x=>x.office===office);
  if(!r) return;
  openModal(`
    <div class="modal-head"><h3>${OFFICE_ICONS[r.office]} ${r.office}</h3><button class="close-x" id="closeModalBtn">✕</button></div>
    <div class="modal-body">
      <div class="kv">
        <div><span>Requirement</span><b>${r.req}</b></div>
        <div><span>Status</span><b>${statusBadge(r.status)}</b></div>
        <div><span>Processed By</span><b>${r.by||'—'}</b></div>
        <div><span>Date</span><b>${r.date||'—'}</b></div>
      </div>
      <div><span class="cell-sub" style="text-transform:uppercase;font-size:11px;letter-spacing:.03em;">Remarks</span>
      <p style="margin-top:6px;font-size:14px;">${r.remarks || 'No remarks yet.'}</p></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" id="closeModalBtn2">Close</button></div>
  `);
}

function modalNewRequestSuccess(refId){
  openModal(`
    <div class="modal-body" style="text-align:center;padding-top:32px;">
      <div style="font-size:44px;margin-bottom:14px;">✅</div>
      <h3 style="margin-bottom:8px;">Clearance request submitted successfully.</h3>
      <p class="cell-sub" style="margin-bottom:18px;">Your request has been sent to all clearing offices for processing.</p>
      <div class="kv" style="grid-template-columns:1fr;"><div><span>Reference Number</span><b class="mono">${refId}</b></div></div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary btn-block" id="closeModalBtn2">Done</button></div>
  `);
}

function modalHistoryDetail(h){
  openModal(`
    <div class="modal-head"><h3>${h.id}</h3><button class="close-x" id="closeModalBtn">✕</button></div>
    <div class="modal-body">
      <div class="kv">
        <div><span>School Year</span><b>${h.sy}</b></div><div><span>Type</span><b>${h.type}</b></div>
        <div><span>Date Submitted</span><b>${h.date}</b></div><div><span>Date Completed</span><b>${h.completed}</b></div>
      </div>
      <div>${statusBadge(h.status)}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" id="closeModalBtn2">Close</button></div>
  `);
}

function modalAdminStudent(s){
  const reqRows = state.requirements.map(r=>`<tr><td>${OFFICE_ICONS[r.office]} ${r.office}</td><td>${statusBadge(r.status)}</td></tr>`).join('');
  openModal(`
    <div class="modal-head"><h3>${s.name}</h3><button class="close-x" id="closeModalBtn">✕</button></div>
    <div class="modal-body">
      <div class="kv">
        <div><span>Student ID</span><b class="mono">${s.id}</b></div><div><span>Status</span><b>${statusBadge(s.status)}</b></div>
        <div><span>Grade/Year</span><b>${s.grade}</b></div><div><span>Section</span><b>${s.section}</b></div>
      </div>
      <table style="width:100%;font-size:13px;"><tbody>${reqRows}</tbody></table>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" id="closeModalBtn2">Close</button></div>
  `);
}

function modalVerify(s){
  openModal(`
    <div class="modal-head"><h3>Clearance Verification</h3><button class="close-x" id="closeModalBtn">✕</button></div>
    <div class="modal-body">
      <div class="kv">
        <div><span>Student</span><b>${s.name}</b></div><div><span>Student ID</span><b class="mono">${s.id}</b></div>
        <div><span>Grade/Year</span><b>${s.grade}</b></div><div><span>Section</span><b>${s.section}</b></div>
      </div>
      <div style="margin-bottom:14px;"><span class="cell-sub" style="font-size:11px;text-transform:uppercase;">Current Office</span><p style="font-size:14px;margin-top:4px;">${OFFICE_ICONS[s.office]||''} ${s.office}</p></div>
      <div class="field"><label>Remarks</label><textarea rows="3" id="verifyRemarks" placeholder="Add remarks for this decision..."></textarea></div>
    </div>
    <div class="modal-foot" style="flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" id="returnCorrectionBtn">Return for Correction</button>
      <button class="btn btn-danger btn-sm" id="rejectBtn">Reject</button>
      <button class="btn btn-primary btn-sm" id="approveBtn">Approve</button>
    </div>
  `);
}

function modalConfirm(msg, onYes){
  openModal(`
    <div class="modal-body" style="text-align:center;padding-top:26px;">
      <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
      <h3 style="margin-bottom:6px;">Are you sure?</h3><p class="cell-sub">${msg}</p>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" id="closeModalBtn2">Cancel</button><button class="btn btn-danger" id="confirmYes">Yes, continue</button></div>
  `);
  document.getElementById('confirmYes').onclick = ()=>{ closeModal(); onYes(); };
}

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click', function(e){
  // nav sidebar links
  const navLink = e.target.closest('.side-link[data-page], .nav-link[data-page]');
  if(navLink){ e.preventDefault(); state.page = navLink.dataset.page; state.sidebarOpen=false; render(); return; }

  if(e.target.closest('#sideToggle')){ state.sidebarOpen = !state.sidebarOpen; render(); return; }
  if(e.target.closest('#logoutBtn')){ state.role=null; state.page='landing'; toast('You have been logged out.'); render(); return; }

  if(e.target.closest('#notifBtn')){
    const p = document.getElementById('notifPanel'); p.classList.toggle('hidden'); e.stopPropagation(); return;
  }
  if(e.target.closest('#markAllRead') || e.target.closest('#markAllRead2')){
    state.notifications.forEach(n=>n.read=true); render(); toast('All notifications marked as read.'); return;
  }

  const reqView = e.target.closest('.req-view');
  if(reqView){ modalRequirementDetail(reqView.dataset.office); return; }

  const histView = e.target.closest('.hist-view');
  if(histView){ const h = state.history.find(x=>x.id===histView.dataset.id); if(h) modalHistoryDetail(h); return; }

  const adminView = e.target.closest('.admin-view');
  if(adminView){ const s = state.adminStudents.find(x=>x.id===adminView.dataset.id); if(s) modalAdminStudent(s); return; }

  const adminVerify = e.target.closest('.admin-verify');
  if(adminVerify){ const s = state.adminStudents.find(x=>x.id===adminVerify.dataset.id); if(s) modalVerify(s); return; }

  const staffReview = e.target.closest('.staff-review');
  if(staffReview){
    const q = state.officeQueue[state.staffOffice];
    const s = q[parseInt(staffReview.dataset.i)];
    modalVerify({...s, office: state.staffOffice, _staffIdx: parseInt(staffReview.dataset.i)});
    return;
  }

  if(e.target.closest('#closeModalBtn') || e.target.closest('#closeModalBtn2')){ closeModal(); return; }
  if(e.target.id==='modalBg'){ closeModal(); return; }

  if(e.target.closest('#approveBtn')){
    const remarks = document.getElementById('verifyRemarks').value || 'Approved — all requirements satisfied.';
    closeModal(); toast('Clearance approved.'); simulateDecision('approved', remarks); return;
  }
  if(e.target.closest('#rejectBtn')){
    modalConfirm("This will reject the student's clearance for this office.", ()=>{
      const remarks = 'Rejected — please see remarks and resubmit.';
      toast('Clearance rejected.', true); simulateDecision('rejected', remarks);
    }); return;
  }
  if(e.target.closest('#returnCorrectionBtn')){
    toast('Returned for correction.'); closeModal(); simulateDecision('pending','Returned for correction — please revise and resubmit.'); return;
  }

  const docReplace = e.target.closest('.doc-replace');
  if(docReplace){ document.getElementById('fileInput').click(); return; }
  const docDelete = e.target.closest('.doc-delete');
  if(docDelete){
    const i = parseInt(docDelete.dataset.i);
    modalConfirm('This document will be permanently removed.', ()=>{
      state.documents.splice(i,1); render(); toast('Document deleted.');
    });
    return;
  }
  if(e.target.closest('#browseBtn')){ document.getElementById('fileInput').click(); return; }

  // close notif dropdown on outside click
  const panel = document.getElementById('notifPanel');
  if(panel && !panel.classList.contains('hidden') && !e.target.closest('.dropdown')){ panel.classList.add('hidden'); }
});

function simulateDecision(status, remarks){
  // reflect decision in the main student's requirements + notifications, for demo cohesion
  const r = state.requirements.find(x=>x.status!=='approved');
  if(r){
    r.status = status; r.remarks = remarks; r.by = state.role==='staff'? (state.staffOffice+' Staff — [No Name]') : '[No Name]';
    r.date = 'Aug 14, 2026';
    state.notifications.unshift({text:`Your ${r.office} clearance has been ${status==='approved'?'approved':status==='rejected'?'rejected':'sent back for correction'}.`, time:'Just now', read:false});
  }
  render();
}

// select changes (filters, office switcher)
document.addEventListener('change', function(e){
  if(e.target.id==='studentSearch') return;
  if(e.target.id==='officeSwitcher'){ state.staffOffice = e.target.value; render(); return; }
  if(['gradeFilter','sectionFilter'].includes(e.target.id)) filterStudents();
  if(e.target.id==='statusFilter') filterRequests();
  if(e.target.id==='fileInput'){
    const files = e.target.files;
    if(files && files.length){
      for(const f of files){
        state.documents.push({name:f.name, size:(Math.round(f.size/1024))+' KB', status:'under review', progress:0});
      }
      render();
      // simulate progress
      setTimeout(()=>{
        const idx = state.documents.length-1;
        if(state.documents[idx]){ state.documents[idx].progress=100; render(); toast('Document uploaded and sent for review.'); }
      }, 700);
    }
  }
});
document.addEventListener('keyup', function(e){
  if(e.target.id==='studentSearch') filterStudents();
  if(e.target.id==='reqSearch') filterRequests();
});
function filterStudents(){
  const q = (document.getElementById('studentSearch')?.value||'').toLowerCase();
  const g = document.getElementById('gradeFilter')?.value||'';
  const sec = document.getElementById('sectionFilter')?.value||'';
  const list = state.adminStudents.filter(s=>
    (s.name.toLowerCase().includes(q) || s.id.includes(q)) &&
    (!g || s.grade===g) && (!sec || s.section===sec)
  );
  const tb = document.getElementById('studentTableBody'); if(tb) tb.innerHTML = renderStudentRows(list);
}
function filterRequests(){
  const q = (document.getElementById('reqSearch')?.value||'').toLowerCase();
  const st = document.getElementById('statusFilter')?.value||'';
  const list = state.adminStudents.filter(s=> (s.name.toLowerCase().includes(q)||s.id.includes(q)) && (!st || s.status===st));
  const tb = document.getElementById('reqTableBody'); if(tb) tb.innerHTML = renderRequestRows(list);
}

// request form submit
document.addEventListener('submit', function(e){
  if(e.target.id==='requestForm'){
    e.preventDefault();
    const ref = 'REQ-2026'+String(Math.floor(Math.random()*90000+10000));
    state.history.unshift({id:ref, sy:'2025-2026', date:'Aug 14, 2026', type:document.getElementById('clearType').value, status:'progress', completed:'—'});
    modalNewRequestSuccess(ref);
  }
});

// drag/drop visuals
document.addEventListener('dragover', function(e){ if(e.target.closest('#dropzone')){ e.preventDefault(); document.getElementById('dropzone').classList.add('drag'); }});
document.addEventListener('dragleave', function(e){ if(e.target.closest('#dropzone')){ document.getElementById('dropzone').classList.remove('drag'); }});
document.addEventListener('drop', function(e){
  if(e.target.closest('#dropzone')){
    e.preventDefault(); document.getElementById('dropzone').classList.remove('drag');
    const files = e.dataTransfer.files;
    if(files && files.length){
      for(const f of files) state.documents.push({name:f.name, size:(Math.round(f.size/1024))+' KB', status:'under review', progress:100});
      render(); toast('Document uploaded and sent for review.');
    }
  }
});

render();

</script>
</body>
</html>
